name: Pipeline

on:
  push:
    branches: [pipeline-testing]

defaults:
  run:
    working-directory: pyxel-api

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff check --fix .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      DB_SSLMODE: disable
      SECRET_KEY: test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pytest

  publis:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: pyxel-api
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  notify:
    needs: [lint, test, publis]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Pipeline ${{ github.ref_name }}"
          body: "lint ${{ needs.lint.result }}, test ${{ needs.test.result }}, publish ${{ needs.publish.result }}"