name: Pipeline

on:
  push:
    branches: [pipeline-testing]

defaults:
  run:
    working-directory: pyxel-api

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      DB_SSLMODE: disable
      SECRET_KEY: test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyxel-api/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest

  notify:
    needs: [lint, test]
    if: always()          # send the email even when a job failed
    runs-on: ubuntu-24.04
    steps:
      - uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: IshiNoAme CI
          subject: "IshiNoAme pipeline on ${{ github.ref_name }}: test ${{ needs.test.result }}"
          body: |
            lint: ${{ needs.lint.result }}
            test: ${{ needs.test.result }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}